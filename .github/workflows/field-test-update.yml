name: Publish Field improvements to build 14

on:
  push:
    branches: [release/field-upload-fix]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: field-submission-test-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_PUBLIC_FIELD_SUBMISSION_ENABLED: 'true'
      FIELD_TEST_PROJECT_REF: iszwqutiayujzjolfesp
      FIELD_TEST_BUILD_ID: e4c71d7c-67a0-4801-84de-8a46c41cb392
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci --include=dev
      - name: Validate Field capture and submission
        run: |
          npx tsc --noEmit
          npm run lint
          node --experimental-strip-types --test src/lib/*.test.ts
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 21.2.0
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Check backend and build 14 compatibility
        run: |
          eas env:pull --environment preview --path "$RUNNER_TEMP/field-preview.env" --non-interactive
          node --env-file="$RUNNER_TEMP/field-preview.env" scripts/check-field-backend.mjs
          eas build:view "$FIELD_TEST_BUILD_ID" --json > "$RUNNER_TEMP/field-installed.json"
          eas fingerprint:compare --build-id "$FIELD_TEST_BUILD_ID" --environment preview --json --non-interactive > "$RUNNER_TEMP/field-fingerprint.json"
          node <<'NODE'
          const fs = require('node:fs');
          const parse = name => {
            const raw = fs.readFileSync(`${process.env.RUNNER_TEMP}/${name}`, 'utf8');
            return JSON.parse(raw.slice(raw.indexOf('{'), raw.lastIndexOf('}') + 1));
          };
          const build = parse('field-installed.json');
          if (build.status !== 'FINISHED' || build.appBuildVersion !== '14' || build.channel !== 'field-submission-test') throw new Error('Unexpected target build');
          const comparison = parse('field-fingerprint.json');
          const installed = comparison.fingerprint1?.hash;
          const candidate = comparison.fingerprint2?.hash;
          if (!installed || installed !== candidate || installed !== build.runtimeVersion) throw new Error('Native runtime mismatch; do not publish this update');
          console.log(JSON.stringify({ build: '14', installed, candidate, compatible: true }));
          NODE
      - name: Publish to the existing test channel
        run: eas update --channel field-submission-test --environment preview --platform ios --message "Simpler jobs, room capture, and send screens" --non-interactive
