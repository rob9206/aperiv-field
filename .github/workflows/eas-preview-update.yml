name: Publish iOS preview update

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eas-update-preview
  cancel-in-progress: false

jobs:
  update:
    name: EAS Update
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Require Expo access token
        shell: bash
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Add the EXPO_TOKEN repository secret before using this workflow."
            echo "https://docs.expo.dev/eas-update/github-actions/"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Check types
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 21.2.0
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish iOS preview update
        run: eas update --channel preview --environment preview --platform ios --message "main@${GITHUB_SHA}" --non-interactive
